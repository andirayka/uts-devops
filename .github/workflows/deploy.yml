name: CI & Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Run Quality & Test Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Run SAST Scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            returntocorp/semgrep:latest \
            semgrep scan \
              --config p/security-audit \
              --config p/owasp-top-ten \
              --config p/typescript \
              --config p/react \
              --config p/nodejsscan \
              --json \
              --output semgrep-results.json \
            || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "Entering project directory on VPS..."
            cd /root/uts-devops

            echo "Pulling latest changes from main branch..."
            git pull origin main

            echo "Pulling latest images from registries..."
            docker compose -f docker-compose.prod.yml pull

            echo "Updating and starting production containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Reloading services with updated configuration..."
            docker compose -f docker-compose.prod.yml restart grafana nginx fluent-bit

            echo "Cleaning dangling images on VPS..."
            docker image prune -f

            echo "Deployment successfully completed!"
