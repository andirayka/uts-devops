[SERVICE]
    Flush         2
    Daemon        Off
    Log_Level     warn
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Path_Key          filepath
    Parser            docker
    DB                /fluent-bit/etc/tail-docker.db
    Mem_Buf_Limit     4MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[FILTER]
    Name    lua
    Match   docker.*
    script  /fluent-bit/etc/docker-metadata.lua
    call    process_docker_log

[OUTPUT]
    Name                   loki
    Match                  docker.*
    Host                   loki
    Port                   3100
    Labels                 job=axon
    Label_Keys             $container
    Remove_Keys            $container
    Line_Format            json
    Auto_Kubernetes_Labels off
